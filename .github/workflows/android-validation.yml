name: Android validation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  build-and-smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Create temporary signing keys
        env:
          CI_STORE_PASSWORD: sabuddy-ci-only
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-upload-key.jks" -storepass "$CI_STORE_PASSWORD" -alias upload -keypass "$CI_STORE_PASSWORD" -dname "CN=SaBuddy CI,O=SaBuddy,C=US" -keyalg RSA -keysize 2048 -validity 10000

      - name: Run unit tests and assemble debug and release APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci-upload-key.jks
          STORE_PASSWORD: sabuddy-ci-only
          KEY_PASSWORD: sabuddy-ci-only
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: sabuddy-validation-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Install and inspect the app in an Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.aistudio.sabuddy.app/com.example.MainActivity
            sleep 12
            mkdir -p docs/screenshots
            adb exec-out screencap -p > docs/screenshots/setup.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            python3 - <<'PY'
            import re
            import subprocess
            import time

            xml = subprocess.check_output(["adb", "shell", "cat", "/sdcard/window.xml"], text=True)
            marker = "Explore Offline First"
            start = xml.find(marker)
            if start < 0:
                raise SystemExit("Setup screen did not expose the offline option")
            bounds = re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"', xml[start:])
            if not bounds:
                raise SystemExit("Could not find the offline option coordinates")
            left, top, right, bottom = map(int, bounds.groups())
            subprocess.run(["adb", "shell", "input", "tap", str((left + right) // 2), str((top + bottom) // 2)], check=True)
            time.sleep(8)
            PY
            adb exec-out screencap -p > docs/screenshots/dashboard.png
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop com.aistudio.sabuddy.app
            adb shell am start -n com.aistudio.sabuddy.app/com.example.MainActivity
            sleep 8
            adb shell pidof com.aistudio.sabuddy.app

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabuddy-emulator-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Add verified screenshots to the pull request
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/setup.png docs/screenshots/dashboard.png
          if git diff --cached --quiet; then
            echo "Screenshots already match the current run."
            exit 0
          fi
          git commit -m "docs: add Android emulator screenshots [skip ci]"
          git push origin "HEAD:$HEAD_REF"
